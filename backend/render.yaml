services:
  - type: web
    name: notification-system-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn notification_core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: POSTMARKAPP_TOKEN
        sync: false
      - key: POSTMARK_FROM_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        value: "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U"
      - key: VAPID_PRIVATE_KEY
        value: "UUx12SmvGWjhqdStw-myVn_E-1jN7S767Jg6-25-83c"
      - key: VAPID_ADMIN_EMAIL
        value: "mailto:admin@example.com"
